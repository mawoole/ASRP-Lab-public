[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asrp-scios"
version = "0.4.0"
description = "Domain-independent foundations for the ASRP Scientific Operating System"
readme = "software/asrp-scios/README.md"
requires-python = ">=3.11"
authors = [
  { name = "ASRP Initiative" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[tool.setuptools]
package-dir = { "" = "software/asrp-scios/src" }

[tool.setuptools.packages.find]
where = ["software/asrp-scios/src"]
